version: '3.8'

# =============================================================================
# CIVICBUILD – MUNICIPAL BUILDING PERMIT AUTOMATION PORTAL
# Full-Stack Orchestration: PostgreSQL 16 + Camunda 8 Zeebe + Spring Boot + React
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL 16 Relational Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: civicbuild-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civicbuild}
      POSTGRES_USER: ${POSTGRES_USER:-civic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civic_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civic_user} -d ${POSTGRES_DB:-civicbuild}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - civicbuild-net

  # ---------------------------------------------------------------------------
  # 2. Camunda 8 Zeebe Standalone Broker & Gateway
  # ---------------------------------------------------------------------------
  zeebe:
    image: camunda/zeebe:8.5.0
    container_name: civicbuild-zeebe
    restart: unless-stopped
    environment:
      - ZEEBE_BROKER_GATEWAY_SECURITY_PLAINTEXT=true
      - ZEEBE_BROKER_CLUSTER_PARTITIONCOUNT=1
      - ZEEBE_BROKER_CLUSTER_CLUSTERSIZE=1
      - ZEEBE_BROKER_CLUSTER_REPLICATIONFACTOR=1
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ENABLED=false
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx512m
    ports:
      - "26500:26500" # Zeebe Gateway gRPC
      - "9600:9600"   # Zeebe Management HTTP
    volumes:
      - zeebedata:/usr/local/zeebe/data
    networks:
      - civicbuild-net

  # ---------------------------------------------------------------------------
  # 3. CivicBuild Spring Boot 3 Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend-springboot
      dockerfile: Dockerfile
    container_name: civicbuild-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      zeebe:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-civicbuild}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-civic_user}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-civic_pass}
      - ZEEBE_CLIENT_ENABLED=true
      - ZEEBE_GATEWAY_ADDRESS=zeebe:26500
      - UPLOAD_DIR=/app/uploads
      - PERMITS_DIR=/app/generated-permits
      - CIVICBUILD_JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    volumes:
      - uploads_data:/app/uploads
      - permits_data:/app/generated-permits
    networks:
      - civicbuild-net

  # ---------------------------------------------------------------------------
  # 4. CivicBuild React 18 SPA Frontend (Nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: civicbuild-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - civicbuild-net

networks:
  civicbuild-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  zeebedata:
    driver: local
  uploads_data:
    driver: local
  permits_data:
    driver: local
